<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Axolotl</title>
    <style>
        body {
            background-image: url('https://transparenttextures.com'), 
                              linear-gradient(rgba(43, 30, 21, 0.85), rgba(43, 30, 21, 0.85)),
                              url('https://unsplash.com');
            background-size: auto, auto, 64px 64px;
            background-repeat: repeat;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding-top: 50px;
            image-rendering: pixelated;
        }
        h1 {
            color: #55FF55;
            text-shadow: 3px 3px 0px #000000;
            font-size: 32px;
        }
        p {
            text-shadow: 2px 2px 0px #000000;
            font-size: 18px;
        }
        .my-button {
            background-color: #5c8e32;
            color: white;
            padding: 12px 24px;
            border: 4px solid #3c5f21;
            border-radius: 0px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000000;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: inset -4px -4px 0px #3c5f21;
        }
        .my-button:hover {
            background-color: #4a7227;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Website! This website's name was given by my sister.</h1>
    <p>This site is hosted directly on GitHub Pages.</p>
    <button class="my-button" onclick="alert('Hello! Thanks for clicking! Here, have some cookies—just kidding. Let\'s play Minecraft after we have lunch!')">Click Me!</button>  
</body>
</html>
